experiment:
  name: conference2_e5_attention_fusion
  protocol: conference2_frozen_v1
  seed: 42
  description: Three-modality multi-head self-attention fusion for food-nutrition
    regression using synthetic clinical context
image_encoder:
  name: google/vit-base-patch16-224
  architecture: ViT-Base/16
  image_size: 224
  hidden_size: 768
  trainable: true
text_encoder:
  name: indobenchmark/indobert-base-p1
  pooling: cls
  hidden_size: 768
  max_length: 48
  trainable: false
clinical_encoder:
  feature_set: E3_CLINICAL_FEATURES_V1
  preprocessing: config/conference2_e3_clinical_preprocessing.json
  input_dim: 16
  hidden_dim: 256
  output_dim: 256
  trainable: true
fusion:
  type: multihead_self_attention
  image_projection: 256
  text_projection: 256
  clinical_projection: 256
  token_dim: 256
  num_modality_tokens: 3
  num_heads: 8
  num_layers: 1
  attention_dropout: 0.2
  pooling: mean
  fused_dim: 256
  regression_hidden: 256
  dropout: 0.2
targets:
  names:
  - mass_g
  - energy_kcal
  - protein_g
  - fat_g
  - carbohydrate_g
  scaler: config/conference2_target_stats.json
  normalization: train_only_zscore
data:
  train_csv: data/processed/train.csv
  val_csv: data/processed/val.csv
  test_csv: data/processed/test.csv
  multimodal_csv: data/processed/multimodal_dataset_v2.csv
  clinical_csv: data/processed/clinical_profiles.csv
  join_key: record_id
  clinical_join_key: clinical_id
  text_column: user_utterance
training:
  batch_size: 8
  num_workers: 0
  epochs: 30
  optimizer: AdamW
  learning_rate: 1.0e-05
  weight_decay: 0.0001
  loss: SmoothL1
  amp: true
  early_stopping:
    enabled: true
    patience: 5
    monitor: val_mae_normalized
    mode: min
evaluation:
  metrics:
  - MAE
  - RMSE
  - R2
  report_original_units: true
  model_selection_uses_test: false
checkpoint:
  path: models/checkpoints/conference2/e5_attention_fusion_best.pt
output:
  directory: results/conference2/E5_attention_fusion
  history_csv: training_history.csv
